spring:
  datasource:
    url: jdbc:mysql://${DB_URL}:3306/cinema
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      timeout: 3s

  session:
    store-type: redis

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}

file:
  storage:
    type: local
  upload:
    base-path: ${FILE_UPLOAD_BASE_PATH:/app/uploads}
    url-prefix: /uploads

logging:
  level:
    com.example.cinema: DEBUG